services:
  web:
    build: .
    container_name: by-balet-menu
    # Dışarıya host portu yok — erişim sadece Cloudflare Tunnel ile
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/prod.db
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/public/uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 200
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Cloudflare Tunnel — router'da port açmadan alan adını Pi'ye bağlar
  # .env içine CLOUDFLARE_TUNNEL_TOKEN ekleyin (Zero Trust → Tunnels → Install)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: by-balet-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
